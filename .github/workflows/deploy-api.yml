# Deploy API (Laravel) ke subdomain api-… — monorepo: hanya jalan bila backend/ berubah.
#
# CARA KERJA: berkas backend DIUNGGAH dari runner ke server (bukan `git pull`),
# persis seperti workflow SPA. Alasannya: folder di server adalah TARGET deploy,
# bukan salinan kerja git, sehingga tidak ada masalah branch/perubahan lokal —
# dan berkas rahasia (.env) maupun dependensi (vendor/, storage/) TIDAK PERNAH
# tersentuh karena semuanya tidak ada di dalam repo.
#
# Semua kegagalan ditulis sebagai ::error:: agar terbaca di tab "Annotations".
name: Deploy API (Laravel)

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:

concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      PHP_BIN: ${{ secrets.PHP_BIN }}
      DEPLOY_PATH_API: ${{ secrets.DEPLOY_PATH_API }}

    steps:
      - name: Periksa secrets wajib
        run: |
          gagal=0
          for s in SSH_HOST SSH_USER SSH_KEY DEPLOY_PATH_API; do
            if [ -z "${!s}" ]; then echo "::error::Secret $s belum diisi di Settings → Secrets and variables → Actions"; gagal=1; fi
          done
          exit $gagal
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          DEPLOY_PATH_API: ${{ secrets.DEPLOY_PATH_API }}

      - uses: actions/checkout@v4

      - name: Unggah berkas backend
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          # `backend` (bukan `backend/*`) supaya berkas titik seperti
          # backend/public/.htaccess ikut; strip_components: 1 membuang awalan "backend/".
          source: 'backend'
          target: ${{ secrets.DEPLOY_PATH_API }}
          strip_components: 1
          overwrite: true

      - name: Pasang dependensi & migrasi (SSH)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          script_stop: true
          envs: PHP_BIN,DEPLOY_PATH_API
          script: |
            set -e
            PHP_BIN="${PHP_BIN:-php}"
            echo "PHP: $($PHP_BIN -v 2>/dev/null | head -1 || echo 'TIDAK DITEMUKAN')"

            if [ ! -d "$DEPLOY_PATH_API" ]; then
              echo "::error title=FOLDER DEPLOY TIDAK ADA::$DEPLOY_PATH_API tidak ditemukan. Perbaiki secret DEPLOY_PATH_API."
              exit 1
            fi
            cd "$DEPLOY_PATH_API"

            if [ ! -f artisan ]; then
              echo "::error title=BUKAN APLIKASI LARAVEL::$DEPLOY_PATH_API tidak memuat artisan. Pastikan document root & DEPLOY_PATH_API menunjuk folder backend (bukan root repo)."
              exit 1
            fi

            if [ ! -f .env ]; then
              echo "::error title=.env TIDAK ADA::Buat $DEPLOY_PATH_API/.env dari backend/.env.production.example lalu jalankan ulang."
              exit 1
            fi

            if command -v composer >/dev/null 2>&1; then
              set -- composer
            elif [ -f "$HOME/composer.phar" ]; then
              set -- "$PHP_BIN" "$HOME/composer.phar"
            else
              echo "::error title=COMPOSER TIDAK DITEMUKAN::Pasang Composer di server (cPanel → MultiPHP/Composer, atau unggah composer.phar ke folder home) lalu jalankan ulang."
              exit 1
            fi

            # Setiap fase melaporkan sendiri bila gagal: pesan ringkas + potongan
            # keluaran terakhir dilampirkan sebagai annotation (agar tidak perlu log).
            fase() {
              label="$1"; shift
              log=/tmp/fase.deploy.log
              if "$@" >"$log" 2>&1; then
                echo "-- $label: OK"
                tail -3 "$log"
              else
                echo "::error title=GAGAL: $label::$(tail -c 400 "$log" | tr '\n' ' ')"
                exit 1
              fi
            }

            echo "== dependensi produksi =="
            fase "composer install" "$@" install --no-dev --optimize-autoloader --no-interaction

            echo "== kunci aplikasi (hanya bila belum ada — tidak pernah menimpa) =="
            if grep -q '^APP_KEY=base64:' .env 2>/dev/null; then
              echo "APP_KEY sudah ada, dilewati."
            else
              fase "key:generate" $PHP_BIN artisan key:generate --force
            fi

            echo "== migrasi database =="
            fase "migrate --force" $PHP_BIN artisan migrate --force

            $PHP_BIN artisan storage:link || true

            echo "== cache produksi (clear dulu) =="
            fase "config:cache" $PHP_BIN artisan config:cache
            fase "route:cache" $PHP_BIN artisan route:cache
            fase "view:cache" $PHP_BIN artisan view:cache
            fase "event:cache" $PHP_BIN artisan event:cache

            echo "== ringkasan =="
            $PHP_BIN artisan --version
            echo "OK: deploy selesai"

      - name: Cek API hidup (bila API_URL diisi)
        # Konteks `secrets` tidak boleh dipakai di `if`, jadi dialirkan lewat env.
        if: env.API_URL != ''
        env:
          API_URL: ${{ secrets.API_URL }}
        run: |
          set -e
          kode=$(curl -s -o /dev/null -w '%{http_code}' -m 20 "$API_URL/ping" || true)
          echo "HTTP $kode dari $API_URL/ping"
          if [ "$kode" != "200" ]; then
            echo "::error::API menjawab HTTP $kode. Cek: document root subdomain API harus menunjuk folder backend/public, lalu lihat storage/logs/laravel.log di server."
            exit 1
          fi
          echo "::notice::API sehat (HTTP 200)."
